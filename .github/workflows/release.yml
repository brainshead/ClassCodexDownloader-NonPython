name: Build and publish ZIP release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n macOS/Update-ClassCodex.sh
          bash -n macOS/ClassCodex-Diff.sh

      - name: Validate release version
        run: |
          test -f "CHANGELOG-${GITHUB_REF_NAME#v}.txt"
          test -f "README-${GITHUB_REF_NAME#v}.txt"

      - name: Package release
        run: |
          mkdir -p dist
          zip -r "dist/ClassCodexDownloader-${GITHUB_REF_NAME}.zip" \
            README.md "README-${GITHUB_REF_NAME#v}.txt" "CHANGELOG-${GITHUB_REF_NAME#v}.txt" \
            NOTICE.md config.txt \
            Update-ClassCodex.ps1 Update-ClassCodex.bat \
            ClassCodex-Diff.ps1 ClassCodex-Diff.bat macOS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ClassCodexDownloader-${{ github.ref_name }}.zip
